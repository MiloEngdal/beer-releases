<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Beer Releases · Systembolaget</title>
<style>
  :root{
    --bg:#0f1216; --card:#171c22; --card2:#1c222a; --line:#272e38;
    --txt:#e8edf2; --muted:#9aa7b4; --accent:#f2b02e; --accent2:#5db07a;
    --new:#e0632b; --chip:#222a33;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --card:#fff; --card2:#f0f2f5; --line:#e2e6ea;
      --txt:#1a2129; --muted:#5c6672; --chip:#eef1f4; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;}
  header{padding:20px 16px 8px;max-width:840px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 2px;letter-spacing:.2px;}
  h1 .em{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;}
  .wrap{max-width:840px;margin:0 auto;padding:0 16px 60px;}
  .controls{position:sticky;top:0;z-index:5;background:var(--bg);
    padding:12px 0 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    border-bottom:1px solid var(--line);margin-bottom:12px;}
  .controls input[type=search]{flex:1 1 180px;min-width:140px;padding:9px 12px;
    border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--txt);font-size:15px;}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{background:var(--card);color:var(--muted);border:0;padding:9px 12px;
    font-size:13px;cursor:pointer;}
  .seg button.on{background:var(--accent);color:#111;font-weight:600;}
  .count{color:var(--muted);font-size:12px;width:100%;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;margin-bottom:10px;scroll-margin-top:90px;transition:box-shadow .2s;}
  .card.hl{box-shadow:0 0 0 2px var(--accent);}
  .row1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .name{font-size:16px;font-weight:650;margin:0;}
  .brew{color:var(--muted);font-size:13px;margin:1px 0 0;}
  .rating{flex:0 0 auto;text-align:center;background:var(--card2);border:1px solid var(--line);
    border-radius:10px;padding:5px 9px;min-width:56px;}
  .rating b{font-size:17px;color:var(--accent2);display:block;line-height:1.1;}
  .rating small{color:var(--muted);font-size:10px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px;}
  .chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;
    padding:3px 9px;font-size:12px;color:var(--muted);}
  .chip.date{color:var(--txt);font-weight:600;}
  .chip.new{background:var(--new);color:#fff;border-color:var(--new);font-weight:700;}
  .chip.soon{color:var(--accent);border-color:var(--accent);}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;}
  .acts a,.acts button{font-size:13px;text-decoration:none;border-radius:9px;
    padding:7px 11px;border:1px solid var(--line);background:var(--card2);color:var(--txt);
    cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
  .acts .cal{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600;}
  .more{display:block;width:100%;margin:10px auto 0;padding:12px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:14px;cursor:pointer;}
  .empty{color:var(--muted);text-align:center;padding:40px 0;}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:24px 0 0;}
  a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>🍺 <span class="em">Beer</span> Releases</h1>
  <div class="sub" id="sub">Upcoming Systembolaget releases, Untappd 4.0+ only.</div>
</header>
<div class="wrap">
  <div class="controls">
    <input type="search" id="q" placeholder="Search beer, brewery, style…" autocomplete="off">
    <div class="seg" id="filter">
      <button data-f="upcoming" class="on">Upcoming</button>
      <button data-f="all">All</button>
    </div>
    <div class="seg" id="sort">
      <button data-s="date" class="on">By date</button>
      <button data-s="rating">By rating</button>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div id="list"></div>
  <button class="more" id="more" hidden>Show more</button>
  <div class="empty" id="empty" hidden>No beers match.</div>
  <footer id="foot"></footer>
</div>
<script>
const PAGE = 20;
let ALL = [], view = [], shown = 0;
let filter = "upcoming", sort = "date", q = "";
const $ = s => document.querySelector(s);
const todayISO = new Date().toISOString().slice(0,10);

function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d+"T00:00:00");
  return dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}
function daysAgo(iso){
  if(!iso) return 999;
  return (Date.now() - new Date(iso).getTime())/864e5;
}
function esc(s){ return (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function pad(n){ return String(n).padStart(2,"0"); }
function icsDate(iso){ // all-day date -> YYYYMMDD
  return iso.replace(/-/g,"");
}
function nextDay(iso){
  const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+1);
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
}
function makeICS(b){
  const now = new Date();
  const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const link = location.origin + location.pathname + "#" + b.id;
  const desc = [
    `${b.style||""} · ${b.abv!=null?b.abv+"%":""} · ${b.price_sek!=null?b.price_sek+" kr":""} · ${b.volume_ml||"?"} ml`,
    `Untappd ${b.rating} (${b.votes||"?"} ratings)`,
    b.sb_url||"", "", link
  ].filter(Boolean).join("\\n");
  const lines = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//milomore//beer//EN","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",`UID:beer-${b.id}@beer.milomore.com`,`DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${icsDate(b.launch_date)}`,`DTEND;VALUE=DATE:${nextDay(b.launch_date)}`,
    `SUMMARY:🍺 ${b.beer} — ${b.brewery}`,`DESCRIPTION:${desc}`,`URL:${link}`,
    "END:VEVENT","END:VCALENDAR"
  ];
  return lines.join("\r\n");
}
function addToCal(b){
  const blob = new Blob([makeICS(b)],{type:"text/calendar"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `beer-${b.id}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

function recompute(){
  view = ALL.filter(b=>{
    if(filter==="upcoming" && (b.launch_date||"") < todayISO) return false;
    if(q){
      const hay = `${b.beer} ${b.brewery} ${b.style}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  view.sort((a,b)=>{
    if(sort==="rating") return (b.rating||0)-(a.rating||0) || (a.launch_date||"").localeCompare(b.launch_date||"");
    // date: upcoming ascending, past descending, upcoming first
    const au = (a.launch_date||"")>=todayISO, bu=(b.launch_date||"")>=todayISO;
    if(au!==bu) return au ? -1 : 1;
    return au ? (a.launch_date||"").localeCompare(b.launch_date||"")
              : (b.launch_date||"").localeCompare(a.launch_date||"");
  });
  shown = 0;
  $("#list").innerHTML = "";
  $("#empty").hidden = view.length>0;
  $("#count").textContent = `${view.length} beer${view.length===1?"":"s"}`;
  renderMore();
}
function cardHTML(b){
  const isNew = daysAgo(b.added_at) <= 3;
  const upcoming = (b.launch_date||"") >= todayISO;
  const soon = upcoming && daysAgo(b.launch_date) >= -7; // within a week
  const chips = [
    `<span class="chip date">${fmtDate(b.launch_date)}</span>`,
    isNew ? `<span class="chip new">NEW</span>` : "",
    !upcoming ? `<span class="chip">released</span>` : (soon?`<span class="chip soon">soon</span>`:""),
    b.style?`<span class="chip">${esc(b.style)}</span>`:"",
    b.abv!=null?`<span class="chip">${b.abv}%</span>`:"",
    b.price_sek!=null?`<span class="chip">${b.price_sek} kr</span>`:"",
    b.volume_ml?`<span class="chip">${b.volume_ml} ml</span>`:"",
  ].filter(Boolean).join("");
  return `<div class="card" id="${esc(b.id)}">
    <div class="row1">
      <div>
        <p class="name">${esc(b.beer)}</p>
        <p class="brew">${esc(b.brewery)}</p>
      </div>
      <div class="rating"><b>${b.rating??"—"}</b><small>${b.votes?b.votes.toLocaleString():"·"}</small></div>
    </div>
    <div class="chips">${chips}</div>
    <div class="acts">
      <button class="cal" data-cal="${esc(b.id)}">📅 Add to calendar</button>
      ${b.sb_url?`<a href="${esc(b.sb_url)}" target="_blank" rel="noopener">Systembolaget ↗</a>`:""}
      ${b.untappd_url?`<a href="${esc(b.untappd_url)}" target="_blank" rel="noopener">Untappd ↗</a>`:""}
    </div>
  </div>`;
}
function renderMore(){
  const slice = view.slice(shown, shown+PAGE);
  $("#list").insertAdjacentHTML("beforeend", slice.map(cardHTML).join(""));
  shown += slice.length;
  $("#more").hidden = shown >= view.length;
  // wire calendar buttons in the new slice
  slice.forEach(b=>{
    const el = document.querySelector(`.card#${CSS.escape(b.id)} [data-cal]`);
    if(el) el.onclick = ()=>addToCal(b);
  });
  maybeScroll();
}
function maybeScroll(){
  const id = location.hash.slice(1);
  if(!id) return;
  const el = document.getElementById(id);
  if(el){ el.classList.add("hl"); el.scrollIntoView({behavior:"smooth",block:"center"});
    location.hash=""; }
}

$("#q").addEventListener("input", e=>{ q=e.target.value.trim().toLowerCase(); recompute(); });
$("#filter").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  filter=b.dataset.f; [...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b)); recompute();
});
$("#sort").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  sort=b.dataset.s; [...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b)); recompute();
});
$("#more").addEventListener("click", renderMore);

fetch("beers.json?_="+Date.now()).then(r=>r.json()).then(d=>{
  ALL = d.beers||[];
  const upc = ALL.filter(b=>(b.launch_date||"")>=todayISO).length;
  $("#sub").textContent = `${ALL.length} tracked · ${upc} upcoming · Untappd 4.0+ only`;
  const gen = d.generated_at ? new Date(d.generated_at) : null;
  $("#foot").textContent = gen ? "Updated "+gen.toLocaleString("en-GB") : "";
  recompute();
}).catch(e=>{ $("#empty").hidden=false; $("#empty").textContent="Couldn't load beers."; });
</script>
</body>
</html>
